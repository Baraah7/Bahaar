name: bahaar
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  intl: ^0.20.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  flutter_riverpod: ^3.1.0
  http: ^1.6.0
  flutter_dotenv: ^6.0.0
  flutter_map: ^8.2.2
  location: ^8.0.1
  latlong2: ^0.9.1
  image_picker: ^1.2.1
  image: ^4.7.2
  tflite_flutter: ^0.12.1
  firebase_auth: ^5.3.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.4
  firebase_app_check: ^0.3.1+4
  flutter_map_marker_cluster: ^8.2.2
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.1
  uuid: ^4.5.2
  path_provider: ^2.1.5
  collection: ^1.19.1
  sensors_plus: ^7.0.0
  camera: ^0.12.0+1
  url_launcher: ^6.3.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - secrets.env
    - assets/logo/app_icon.png
    - assets/logo/appIcon.png
    - assets/logo/logo.png
    - assets/data/gulf_test_features.geojson
    - assets/data/marinas.geojson
    - assets/data/fishing_activity_sample.geojson
    - assets/data/fish_probability_fallback.json
    - assets/data/seaports.json
    - assets/data/protected-areas.json
    - assets/data/bahrain_exclusion_zones.geojson
    - assets/data/stars_2500.json
    - assets/navigation/
    - assets/models/
    - lib/widgets/map/mask/bahrain_territorial_waters.tif
    - assets/depth_gebco.mbtiles
    - assets/models/fish_classifier.tflite
    - assets/models/labels.txt
    - assets/images/Seabass.jpg
    - assets/images/Shrimp.jpeg
    - assets/images/Gilt-Head Bream.jpg
    - assets/images/Horse mackerel.jpg
    - assets/images/Red Mullet.jpg
    - assets/logo/logoForLogin.png
    - assets/images/Red Mullet.jpg


  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Zain
      fonts:
        - asset: assets/fonts/Zain/Zain-Regular.ttf
        - asset: assets/fonts/Zain/Zain-Italic.ttf
        - asset: assets/fonts/Zain/Zain-Bold.ttf
        - asset: assets/fonts/Zain/Zain-Light.ttf
          weight: 300
    - family: Space_Grotesk
      fonts:
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Bold.ttf
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Light.ttf
          weight: 300
  
